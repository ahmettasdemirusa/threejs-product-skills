<!doctype html>
<!--
  Three.js product viewer: starter template.
  From the threejs-product-skills repo · MIT License · Ahmet Tasdemir

  - Loads a glTF/GLB (Draco, Meshopt and KTX2 compression supported)
  - Frames the product automatically, whatever its size or origin
  - Studio lighting from an environment map, soft contact shadow
  - Orbit controls with sensible limits; auto-rotate until the first touch
  - Renders only when something changes (saves battery on phones)
  Change MODEL_URL, or pass ?model=path/to/model.glb for testing.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f5f7; font-family: system-ui, sans-serif; }
  .viewer { position: relative; width: 100%; height: 100%; min-height: 320px; }
  .viewer canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  .status { position: absolute; inset: auto 0 16px 0; text-align: center; font-size: 13px; color: #555; pointer-events: none; }
  .bar { width: 160px; height: 3px; margin: 8px auto 0; background: rgba(0,0,0,.1); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #1a73e8; transition: width .2s; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
</head>
<body>
<div class="viewer" id="viewer">
  <div class="status" id="status">Loading 3D model…<div class="bar"><i id="bar"></i></div></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const MODEL_URL = new URLSearchParams(location.search).get('model') || '../../../assets/mug-optimized.glb';
const LABEL = 'Ceramic mug, interactive 3D view';

const container = document.getElementById('viewer');
const statusEl = document.getElementById('status');
const barEl = document.getElementById('bar');

// --- renderer ----------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // cap for mobile GPUs
renderer.toneMapping = THREE.NeutralToneMapping;               // keeps product colours close to the source
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;           // PCFSoftShadowMap was removed in r18x; soften with shadow.radius
renderer.domElement.setAttribute('role', 'img');
renderer.domElement.setAttribute('aria-label', LABEL);
renderer.domElement.tabIndex = 0;
container.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.maxPolarAngle = Math.PI * 0.49;   // don't look from under the floor
controls.autoRotate = !matchMedia('(prefers-reduced-motion: reduce)').matches;
controls.autoRotateSpeed = 1.5;
controls.addEventListener('start', () => { controls.autoRotate = false; });

// Soft shadow under the product.
const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.radius = 4;
scene.add(key);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShadowMaterial({ opacity: 0.18 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// --- render on demand ----------------------------------------------------------------
let needsRender = true;
const requestRender = () => { needsRender = true; };
renderer.setAnimationLoop(() => {
  // update() returns true while the camera moves (damping, auto-rotate, user input).
  if (controls.update() || needsRender) {
    renderer.render(scene, camera);
    needsRender = false;
  }
});

new ResizeObserver(() => {
  const { clientWidth: w, clientHeight: h } = container;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  requestRender();
}).observe(container);

// --- load the model ------------------------------------------------------------------
const draco = new DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
const ktx2 = new KTX2Loader()
  .setTranscoderPath('https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/libs/basis/')
  .detectSupport(renderer);
const loader = new GLTFLoader().setDRACOLoader(draco).setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder);

loader.load(MODEL_URL, (gltf) => {
  const model = gltf.scene;
  model.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(model);
  frame(model);
  statusEl.remove();
  requestRender();
  container.dispatchEvent(new CustomEvent('model-loaded', { detail: { gltf } }));
}, (e) => {
  if (e.lengthComputable) barEl.style.width = (100 * e.loaded / e.total) + '%';
}, (err) => {
  console.error(err);
  statusEl.textContent = 'Sorry, the 3D model could not be loaded.';
});

// Centre the model on the floor and fit the camera to it, whatever units the file uses.
function frame(model) {
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  model.position.x -= center.x;
  model.position.z -= center.z;
  model.position.y -= box.min.y;

  const radius = size.length() / 2;
  const fov = THREE.MathUtils.degToRad(camera.fov);
  const distance = (radius / Math.sin(fov / 2)) * 1.1;
  controls.target.set(0, size.y / 2, 0);
  camera.position.set(distance * 0.55, size.y / 2 + distance * 0.35, distance * 0.75);
  camera.near = distance / 100;
  camera.far = distance * 100;
  camera.updateProjectionMatrix();
  controls.minDistance = distance * 0.5;
  controls.maxDistance = distance * 2.5;
  controls.update();

  ground.scale.setScalar(radius * 6);
  key.position.set(radius * 2, radius * 4, radius * 3);
  const s = key.shadow.camera;
  s.left = s.bottom = -radius * 2;
  s.right = s.top = radius * 2;
  s.near = 0.01;
  s.far = radius * 12;
  s.updateProjectionMatrix();
}
</script>
</body>
</html>
